# Nginx фронтенд-контейнера (ЛР №8).
#
#  1) отдаёт собранное React-приложение (SPA: любой путь → index.html);
#  2) reverse-proxy: /api/ и /socket.io/ → backend:5000 (доп. требование).
# Благодаря прокси браузер общается с одним origin (http://localhost),
# поэтому CORS для фронтенда не нужен, а backend недоступен напрямую извне
# (порт 5000 опубликован только для проверки вручную).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Сжатие статики
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # SPA-роутинг: реальные файлы отдаются как есть, остальное — index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST API → backend (путь сохраняется: /api/v1/... → backend:5000/api/v1/...)
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO (WebSocket + polling) → backend, с заголовками Upgrade
  location /socket.io/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket-соединение живёт долго — не рвём его по таймауту
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
